name: Media Search

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search keywords'
        required: true

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run SoundCloud Search
        env:
          SEARCH_QUERY: ${{ github.event.inputs.query }}
        run: |
          python3 -c '
          import os, json, yt_dlp

          query = os.environ["SEARCH_QUERY"]
          ydl_opts = {"extract_flat": True, "quiet": True}

          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              info = ydl.extract_info(f"scsearch5:{query}", download=False)
              results = []
              for entry in info.get("entries", []):
                  results.append({
                      "title": entry.get("title") or "Unknown Track",
                      "url": entry.get("url") or entry.get("webpage_url"),
                      "duration": entry.get("duration_string", "N/A"),
                      "thumbnail": entry.get("thumbnail") or "https://sndcdn.com"
                  })

          with open("results.json", "w") as f:
              json.dump(results, f, indent=2)
          '

      - name: Commit results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add results.json
          git commit -m "Update search results" || exit 0
          git push
