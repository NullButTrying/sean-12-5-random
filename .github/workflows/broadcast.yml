name: Cast 96kbps MP3 to Caster.fm

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Song Name or SoundCloud URL'
        required: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Search/Download & Convert to 96kbps MP3
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          mkdir -p output
          if [[ "$INPUT_QUERY" == http* ]]; then
            TARGET="$INPUT_QUERY"
          else
            TARGET="scsearch1:$INPUT_QUERY"
          fi

          yt-dlp -x --audio-format mp3 --audio-quality 96K -o "output/track.%(ext)s" "$TARGET"
          TITLE=$(yt-dlp --get-title "$TARGET" | tr -d '\n\r"' | cut -c 1-80)
          echo "TRACK_TITLE=$TITLE" >> $GITHUB_ENV

      - name: Stream Live to Caster.fm with Metadata
        env:
          HOST: ${{ secrets.CASTER_HOST }}
          PORT: ${{ secrets.CASTER_PORT }}
          MOUNT: ${{ secrets.CASTER_MOUNT }}
          PASS: ${{ secrets.CASTER_PASSWORD }}
        run: |
          ffmpeg -re -i output/track.mp3 \
            -c:a copy \
            -content_type audio/mpeg \
            -ice_name "Auto Radio Stream" \
            -metadata title="${TRACK_TITLE}" \
            -f mp3 "icecast://source:${PASS}@${HOST}:${PORT}${MOUNT}"

      - name: Delete Temporary Audio File
        if: always()
        run: |
          rm -rf output/track.mp3 output
          echo "Temporary audio file wiped."
