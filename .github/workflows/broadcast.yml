name: Cast 96kbps MP3 to Caster.fm

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    services:
      cobalt:
        image: ghcr.io/imputnet/cobalt:latest
        ports:
          - 9000:9000
        env:
          API_URL: "http://localhost:9000/"
          API_AUTH_REQUIRED: "false"

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl

      - name: Fetch Audio via Local Cobalt Instance
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p output
          sleep 3

          RESPONSE=$(curl -s -X POST "http://localhost:9000/" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${VIDEO_URL}\", \"downloadMode\": \"audio\", \"audioFormat\": \"mp3\", \"audioBitrate\": \"96\"}")

          STREAM_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          TITLE=$(echo "$RESPONSE" | jq -r '.filename // "Live Radio Track"' | sed 's/\.[^.]*$//' | tr -d '\n\r"' | cut -c 1-80)

          if [ -z "$STREAM_URL" ]; then
            echo "Cobalt failed to extract audio: $RESPONSE"
            exit 1
          fi

          echo "TRACK_TITLE=$TITLE" >> $GITHUB_ENV
          curl -L -s "$STREAM_URL" -o output/raw_audio

          ffmpeg -y -i output/raw_audio -vn -ar 44100 -ac 2 -b:a 96k output/track.mp3
          rm -f output/raw_audio

      - name: Stream Live to Caster.fm with Metadata
        env:
          HOST: ${{ secrets.CASTER_HOST }}
          PORT: ${{ secrets.CASTER_PORT }}
          MOUNT: ${{ secrets.CASTER_MOUNT }}
          PASS: ${{ secrets.CASTER_PASSWORD }}
        run: |
          ffmpeg -re -i output/track.mp3 \
            -c:a copy \
            -content_type audio/mpeg \
            -ice_name "Auto Radio Stream" \
            -metadata title="${TRACK_TITLE}" \
            -f mp3 "icecast://source:${PASS}@${HOST}:${PORT}${MOUNT}"

      - name: Delete Temporary Audio File
        if: always()
        run: |
          rm -rf output/track.mp3 output
          echo "Temporary audio file wiped."
