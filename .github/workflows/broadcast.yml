name: Cast 96kbps MP3 to Caster.fm

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Song Name or URL'
        required: true

concurrency:
  group: caster-fm-radio-queue
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore Cached yt-dlp
        id: cache-tools
        uses: actions/cache@v5
        with:
          path: ~/.local/tools
          key: yt-dlp-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install yt-dlp & Verify ffmpeg
        timeout-minutes: 3
        run: |
          mkdir -p ~/.local/tools
          if [ ! -x ~/.local/tools/yt-dlp-bin ]; then
            python3 -m pip install --disable-pip-version-check --timeout 30 --no-deps --target ~/.local/tools/yt-dlp yt-dlp
            printf '#!/usr/bin/env bash\nPYTHONPATH="$HOME/.local/tools/yt-dlp" python3 -m yt_dlp "$@"\n' > ~/.local/tools/yt-dlp-bin
            chmod +x ~/.local/tools/yt-dlp-bin
          fi
          ffmpeg -version | head -n 1

      - name: Stream Live at 96kbps & Update Now Playing
        timeout-minutes: 15
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
          HOST: ${{ secrets.CASTER_HOST }}
          PORT: ${{ secrets.CASTER_PORT }}
          MOUNT: ${{ secrets.CASTER_MOUNT }}
          PASS: ${{ secrets.CASTER_PASSWORD }}
        run: |
          export PATH="$HOME/.local/tools:$PATH"
          CLEAN_HOST=$(echo "$HOST" | sed -E 's|^https?://||; s|/.*||; s|:.*||' | tr -d '[:space:]')
          CLEAN_PORT=$(echo "$PORT" | tr -d '[:space:]')
          CLEAN_MOUNT=$(echo "$MOUNT" | tr -d '[:space:]')
          [[ "$CLEAN_MOUNT" != /* ]] && CLEAN_MOUNT="/$CLEAN_MOUNT"

          IPV4=$(getent ahostsv4 "$CLEAN_HOST" | awk '{print $1; exit}')
          TARGET_HOST=${IPV4:-$CLEAN_HOST}

          mkdir -p output
          if [[ "$INPUT_QUERY" == http* ]]; then
            yt-dlp-bin --no-progress --socket-timeout 20 -f "bestaudio/best" --no-playlist -o "output/raw.%(ext)s" "$INPUT_QUERY"
            RAW_TITLE=$(yt-dlp-bin --no-progress --socket-timeout 20 --get-title "$INPUT_QUERY")
          else
            yt-dlp-bin --no-progress --socket-timeout 20 -f "bestaudio/best" \
              --match-filter "duration > 60" \
              --max-downloads 1 \
              --no-playlist \
              -o "output/raw.%(ext)s" \
              "scsearch5:${INPUT_QUERY}" || true
            RAW_TITLE="$INPUT_QUERY"
          fi

          RAW_FILE=$(find output -maxdepth 1 -type f -name 'raw.*' | head -n 1)
          if [ -z "$RAW_FILE" ]; then
            yt-dlp-bin --no-progress --socket-timeout 20 -f "bestaudio/best" --no-playlist -o "output/raw.%(ext)s" "scsearch1:${INPUT_QUERY}"
            RAW_FILE=$(find output -maxdepth 1 -type f -name 'raw.*' | head -n 1)
          fi

          CLEAN_TITLE=$(echo "$RAW_TITLE" | tr -d '\n\r' | cut -c 1-80)

          echo "Connecting to icecast://${TARGET_HOST}:${CLEAN_PORT}${CLEAN_MOUNT}..."
          ffmpeg -loglevel info -stats -re -rw_timeout 15000000 -i "$RAW_FILE" \
            -vn \
            -af "apad=pad_dur=2" \
            -c:a libmp3lame -b:a 96k -ar 44100 -ac 2 \
            -content_type audio/mpeg \
            -ice_name "Live Auto Radio" \
            -f mp3 "icecast://source:${PASS}@${TARGET_HOST}:${CLEAN_PORT}${CLEAN_MOUNT}" &
          FFMPEG_PID=$!

          sleep 4
          if ! kill -0 $FFMPEG_PID 2>/dev/null; then
            echo "ERROR: ffmpeg exited immediately. Check your Caster.fm server status and secrets."
            wait $FFMPEG_PID
            exit 1
          fi

          ENCODED_SONG=$(CLEAN_TITLE="$CLEAN_TITLE" python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["CLEAN_TITLE"]))')
          curl -s --max-time 10 -u "source:${PASS}" "http://${TARGET_HOST}:${CLEAN_PORT}/admin/metadata?mount=${CLEAN_MOUNT}&mode=updinfo&song=${ENCODED_SONG}" || true

          wait $FFMPEG_PID
          echo "Finished streaming $CLEAN_TITLE."
          rm -rf output
