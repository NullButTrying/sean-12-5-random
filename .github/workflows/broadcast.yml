name: Cast 96kbps MP3 to Caster.fm

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Song Name or URL'
        required: true

concurrency:
  group: caster-fm-radio-queue
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp Fast (3s)
        run: pip install --quiet --no-deps yt-dlp

      - name: Stream Live Immediately at 96kbps & Update Now Playing
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
          HOST: ${{ secrets.CASTER_HOST }}
          PORT: ${{ secrets.CASTER_PORT }}
          MOUNT: ${{ secrets.CASTER_MOUNT }}
          PASS: ${{ secrets.CASTER_PASSWORD }}
        run: |
          CLEAN_HOST=$(echo "$HOST" | sed -E 's|^https?://||; s|/.*||; s|:.*||' | tr -d '[:space:]')
          CLEAN_PORT=$(echo "$PORT" | tr -d '[:space:]')
          CLEAN_MOUNT=$(echo "$MOUNT" | tr -d '[:space:]')
          [[ "$CLEAN_MOUNT" != /* ]] && CLEAN_MOUNT="/$CLEAN_MOUNT"

          IPV4=$(getent ahostsv4 "$CLEAN_HOST" | awk '{print $1; exit}')
          TARGET_HOST=${IPV4:-$CLEAN_HOST}

          mkdir -p output
          if [[ "$INPUT_QUERY" == http* ]]; then
            yt-dlp -f "bestaudio/best" --no-playlist -o "output/raw.%(ext)s" "$INPUT_QUERY"
            RAW_TITLE=$(yt-dlp --get-title "$INPUT_QUERY")
          else
            yt-dlp -f "bestaudio/best" \
              --match-filter "duration > 60" \
              --max-downloads 1 \
              --no-playlist \
              -o "output/raw.%(ext)s" \
              "scsearch5:${INPUT_QUERY}" || true
            RAW_TITLE="$INPUT_QUERY"
          fi

          if [ ! -f output/raw.* ]; then
            yt-dlp -f "bestaudio/best" --no-playlist -o "output/raw.%(ext)s" "scsearch1:${INPUT_QUERY}"
          fi

          CLEAN_TITLE=$(echo "$RAW_TITLE" | tr -d '\n\r"' | cut -c 1-80)

          ffmpeg -re -i output/raw.* \
            -vn \
            -c:a libmp3lame -b:a 96k -ar 44100 -ac 2 \
            -content_type audio/mpeg \
            -ice_name "Live Auto Radio" \
            -f mp3 "icecast://source:${PASS}@${TARGET_HOST}:${CLEAN_PORT}${CLEAN_MOUNT}" &
          FFMPEG_PID=$!

          sleep 3
          ENCODED_SONG=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv))' "$CLEAN_TITLE")
          curl -s -u "source:${PASS}" "http://${TARGET_HOST}:${CLEAN_PORT}/admin/metadata?mount=${CLEAN_MOUNT}&mode=updinfo&song=${ENCODED_SONG}" || true

          wait $FFMPEG_PID
          rm -rf output
